[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/store",
    "crates/autoconfig",
    "crates/accounts",
    "crates/oauth",
    "crates/net",
    "crates/imap",
    "crates/pop3",
    "crates/sync",
    "crates/dav",
    "crates/pim-sync",
    "crates/compose",
    "crates/engine",
    "crates/html-view",
    "crates/ui",
    "apps/iuredesk",
    "xtask",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.91"
license = "FSL-1.1-ALv2"
authors = ["Eduardo Llaguno"]
repository = "https://github.com/ellaguno/iuredesk"

[workspace.dependencies]
# internos
iuredesk-model = { path = "crates/model" }
iuredesk-store = { path = "crates/store" }
iuredesk-autoconfig = { path = "crates/autoconfig" }
iuredesk-accounts = { path = "crates/accounts" }
iuredesk-oauth = { path = "crates/oauth" }
iuredesk-net = { path = "crates/net" }
iuredesk-imap = { path = "crates/imap" }
iuredesk-pop3 = { path = "crates/pop3" }
iuredesk-sync = { path = "crates/sync" }
iuredesk-dav = { path = "crates/dav" }
iuredesk-pim-sync = { path = "crates/pim-sync" }
iuredesk-compose = { path = "crates/compose" }
iuredesk-engine = { path = "crates/engine" }
iuredesk-html-view = { path = "crates/html-view" }
iuredesk-ui = { path = "crates/ui" }

# suite Iurefficient (repos hermanos)
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.7.1", default-features = false }
# ui-kit compartido con IureProject (PLAN.md D11). Para desarrollo local: [patch] en .cargo/config.toml.
iurefficient-ui = { git = "https://github.com/ellaguno/iurefficient-ui", branch = "main" }

# base (todo Rust puro; ver docs/excepciones.md)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10"
quick-xml = "0.41"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", default-features = false }
dirs = "6"
redb = "4"
# sin zstd (zstd-sys es C): solo lz4 (lz4_flex, Rust puro) para el almacén de documentos
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
# blobs: zstd en Rust puro (ver crates/store/src/blob.rs)
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
tempfile = "3"
# 1.x exige Rust 1.98; la cadena actual es 1.97
mail-parser = "0.11"
# sin `gethostname`: el Message-ID lo genera siempre el redactor con el dominio de la identidad
mail-builder = { version = "0.4", default-features = false }
# redactor (F1.2): Markdown e IDNA, Rust puro
pulldown-cmark = { version = "0.13", default-features = false }
idna = "1"
proptest = "1"
anyhow = "1"
# recurrencias RFC 5545 (Rust puro; ver la elección en crates/dav/src/lib.rs)
rrule = { version = "0.14", default-features = false }
# red de autoconfig y cuentas (Rust puro; TLS con rustls + ring, ver docs/excepciones.md)
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
base64 = "0.22"
md-5 = "0.10"
# oauth: azar para PKCE, abrir el navegador del sistema, URL, cancelación (Rust puro)
getrandom = "0.2"
open = "5"
url = "2"
tokio-util = { version = "0.7", default-features = false }
# xtask: paquetes de publicación
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }

# html-view (F0.3): Blitz + rasterizador en CPU, todo Rust puro (ver docs/html-view.md)
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", default-features = false }
parley = { version = "0.12", default-features = false, features = ["std"] }
peniko = "0.6"
glifo = { version = "0.4", default-features = false, features = ["std", "png"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
html5ever = "0.40"
png = "0.18"

# ui: versión unificada en toda la suite (decisión 2026-10-26)
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dist]
inherits = "release"
strip = true
