[package]
name = "iuredesk-crypto"
description = "Correo seguro: OpenPGP (rPGP, PGP/MIME, Autocrypt, WKD) y S/MIME (CMS) en Rust puro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pgp = { workspace = true }
cms = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
const-oid = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
ecdsa = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
signature = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
rand = { workspace = true }
p12-keystore = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
mail-parser = { workspace = true }
reqwest = { workspace = true }
webpki-roots = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
