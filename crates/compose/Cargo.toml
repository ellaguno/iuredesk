[package]
name = "iuredesk-compose"
description = "Redactor: borradores, cuerpo enriquecido, respuestas/reenvíos, MIME, firmas, plantillas y envío (SMTP + bandeja de salida)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
iuredesk-model = { workspace = true }
iuredesk-store = { workspace = true }
iuredesk-accounts = { workspace = true }
iuredesk-oauth = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "sync"] }
lettre = { workspace = true }
mail-parser = { workspace = true }
mail-builder = { workspace = true }
html5ever = { workspace = true }
pulldown-cmark = { workspace = true }
idna = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
