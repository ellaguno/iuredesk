[package]
name = "iuredesk-ui"
description = "Interfaz de escritorio egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
iuredesk-model = { workspace = true }
iuredesk-store = { workspace = true }
iuredesk-engine = { workspace = true }
iuredesk-html-view = { workspace = true }
iurefficient-ui = { workspace = true }
egui = { workspace = true }
chrono = { workspace = true }
# Abre enlaces en el navegador del sistema (xdg-open/open/start; Rust puro).
open = { workspace = true }
# Selector de archivos para adjuntar (portal XDG en Linux).
rfd = { workspace = true }

[dev-dependencies]
iuredesk-accounts = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tempfile = { workspace = true }
# Recorte de las capturas de `ui_shot` (`--crop-height`).
image = { workspace = true }

[lints]
workspace = true
