[package]
name = "iuredesk-oauth"
description = "OAuth 2 para apps nativas (código + PKCE, loopback): Google, Microsoft; tokens y SASL XOAUTH2/OAUTHBEARER"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
iuredesk-model = { workspace = true }
iuredesk-accounts = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "sync"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
url = { workspace = true }
# Abre el navegador del sistema lanzando `xdg-open` / `open` / `start` (Rust puro, sin C).
open = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
proptest = { workspace = true }

[lints]
workspace = true
