[package]
name = "iuredesk-imap"
description = "Cliente IMAP4rev1/rev2 asíncrono (tokio + rustls): IDLE, CONDSTORE/QRESYNC, MOVE, UIDPLUS, COMPRESS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Servidor IMAP falso y programable para las pruebas de este crate y de `iuredesk-sync`.
test-server = ["tokio/sync", "tokio/rt"]

[dependencies]
iuredesk-model = { workspace = true }
iuredesk-net = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
# COMPRESS=DEFLATE (RFC 4978) con el motor en Rust puro (miniz_oxide).
flate2 = { workspace = true, features = ["rust_backend"] }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
iuredesk-imap = { path = ".", features = ["test-server"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
proptest = { workspace = true }

[lints]
workspace = true
