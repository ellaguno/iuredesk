[package]
name = "iuredesk-audio"
description = "Reproduce audio (las noticias habladas de «Mi día»): decodifica en Rust (symphonia) y suena por la salida del sistema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror = { workspace = true }
symphonia = { workspace = true }

# Windows y macOS: WASAPI y CoreAudio por sus enlaces en Rust. En Linux no: cpal arrastra
# alsa-sys (C); ahí el sonido va a la herramienta del sistema (pw-cat, pacat o aplay).
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
