[package]
name = "iuredesk-html-view"
description = "Render de correo HTML con Blitz a imagen RGBA + mapa de enlaces (sin webview)"
version.workspace = true
edition.workspace = true
# Blitz 0.3 exige Rust 1.91 (el resto del workspace declara 1.88).
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Sin la feature «system-fonts»: arrastraría yeslogic-fontconfig-sys (C). Las fuentes del sistema
# se cargan en Rust puro desde src/fonts.rs.
blitz-dom = { workspace = true, features = ["svg", "woff", "floats"] }
blitz-html = { workspace = true }
blitz-paint = { workspace = true, features = ["svg"] }
blitz-traits = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
parley = { workspace = true }
peniko = { workspace = true }
# Solo para activar «png»: sin ella los emoji a color (CBDT, p. ej. Noto Color Emoji) salen en blanco.
glifo = { workspace = true }
# blitz-dom trae `image` sin decodificadores; aquí se activan los formatos de correo (Rust puro).
image = { workspace = true }
html5ever = { workspace = true }
thiserror = { workspace = true }
# F5.4: imprimir / guardar como PDF (Rust puro; Flate con miniz_oxide)
pdf-writer = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
png = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
