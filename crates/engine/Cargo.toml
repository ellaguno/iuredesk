[package]
name = "iuredesk-engine"
description = "Session, registro de comandos, deshacer, i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
iuredesk-model = { workspace = true }
iuredesk-store = { workspace = true }
iuredesk-accounts = { workspace = true }
iuredesk-autoconfig = { workspace = true }
iuredesk-oauth = { workspace = true }
# F1.3: sincronización real y envío (bandeja de salida con SMTP).
iuredesk-sync = { workspace = true }
iuredesk-compose = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
mail-parser = { workspace = true }
# Descarga de imágenes remotas que el usuario permite ver (rustls, Rust puro).
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }
iuredesk-imap = { workspace = true, features = ["test-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }

[lints]
workspace = true
