# Publicación: al subir una etiqueta vX.Y.Z compila los instaladores de los tres SO con
# `cargo xtask package <so>` (cargo-packager, nombres del esquema de iureapps), los firma con
# minisign (`cargo xtask sign`) y publica el Release en este mismo repositorio (público desde
# 2026-10-28, Apache-2.0) como «último» release: iureapps lo busca con /releases/latest, que
# ignora borradores y preliminares; la alfa se indica en el título y en el catálogo de iureapps.
# Secretos (todos opcionales): IUREDESK_MINISIGN_KEY (+ IUREDESK_MINISIGN_PASSWORD) para las
# firmas que verifica iureapps; macOS: DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_PASSWORD,
# KEYCHAIN_PASSWORD, APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID y ASC_PRIVATE_KEY (Developer ID +
# notarización); los de firma de Windows y SUITE_REPOS_TOKEN.
# Windows también arma el paquete MSIX para Microsoft Store (artefactos `msix-store`, sin firmar,
# para Partner Center, y `msix-prueba`, firmado con un certificado de prueba, que se instala y se
# prueba en el runner); no va a la release. A mano (Run workflow) compila y prueba todo sin
# publicar nada. Ver docs/publicacion.md y «Microsoft Store (MSIX)» en el README.
name: Publicación

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PACKAGER_VERSION: "0.11.8"
  # Identificadores OAuth incrustados al compilar (`option_env!`, docs/oauth.md). Sin ellos el botón
  # «Continuar con Google/Microsoft» no aparece y Google solo da el correo con contraseña de app.
  IUREDESK_GOOGLE_CLIENT_ID: ${{ secrets.IUREDESK_GOOGLE_CLIENT_ID }}
  IUREDESK_GOOGLE_CLIENT_SECRET: ${{ secrets.IUREDESK_GOOGLE_CLIENT_SECRET }}
  IUREDESK_MS_CLIENT_ID: ${{ secrets.IUREDESK_MS_CLIENT_ID }}

jobs:
  package:
    name: Paquetes ${{ matrix.os }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, para que el binario corra también en distribuciones más antiguas.
          - { runner: ubuntu-22.04, os: linux, target: x86_64-unknown-linux-gnu }
          - { runner: windows-latest, os: windows, target: x86_64-pc-windows-msvc }
          - { runner: macos-latest, os: macos, target: aarch64-apple-darwin }
          - { runner: macos-latest, os: macos, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    # macOS espera a la notarización de Apple (hasta 150 min en el peor caso).
    timeout-minutes: ${{ matrix.os == 'macos' && 240 || 120 }}
    steps:
      - uses: actions/checkout@v4
      - name: Acceso a repos privados de la suite (opcional)
        shell: bash
        env:
          SUITE_REPOS_TOKEN: ${{ secrets.SUITE_REPOS_TOKEN }}
        run: |
          if [ -z "$SUITE_REPOS_TOKEN" ]; then
            echo "Sin SUITE_REPOS_TOKEN: los repos de la suite son públicos, no hace falta."
            exit 0
          fi
          git config --global url."https://x-access-token:${SUITE_REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Dependencias de compilación de Linux (winit, wgpu; sin GTK)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev file
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust estable
        shell: bash
        run: |
          rustup toolchain install  # versión fijada en rust-toolchain.toml
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Caché de cargo-packager
        id: packager-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-${{ env.CARGO_PACKAGER_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Instalar cargo-packager (herramienta de compilación)
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version ${{ env.CARGO_PACKAGER_VERSION }} --locked
      - name: Certificado de firma de Windows (si está configurado)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
            Remove-Item $pfx
            Write-Host "Certificado importado en CurrentUser\My"
          }
          if ($env:WINDOWS_SIGN_COMMAND -like "trusted-signing-cli*") {
            cargo install trusted-signing-cli --locked
          }
      # macOS: el certificado Developer ID va a un keychain temporal (se borra al final) y la clave de
      # App Store Connect a un archivo temporal. cargo-packager firma el .app (hardened runtime) y el
      # .dmg; la notarización va en un paso aparte. Sin los secretos sale sin firmar, como antes.
      - name: Firma de Apple (keychain temporal)
        if: matrix.os == 'macos'
        id: apple
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEVELOPER_ID_P12_BASE64" ] || [ -z "$DEVELOPER_ID_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::warning::Sin DEVELOPER_ID_P12_BASE64/DEVELOPER_ID_PASSWORD/KEYCHAIN_PASSWORD: el .app y el .dmg salen sin firmar."
            exit 0
          fi
          KC="$RUNNER_TEMP/iuredesk-firma.keychain-db"
          P12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$P12" -k "$KC" -P "$DEVELOPER_ID_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*(\('"$APPLE_TEAM_ID"'\))\)".*/\1/p' | head -n1)"
          if [ -z "$IDENTITY" ]; then
            security find-identity -v -p codesigning "$KC"
            echo "::error::El .p12 no trae una identidad «Developer ID Application» del equipo $APPLE_TEAM_ID."
            exit 1
          fi
          echo "Identidad: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
            chmod 600 "$KEY"
            # Con otros nombres que APPLE_API_*: así cargo-packager no notariza el .app por su cuenta
            # (serían dos esperas en serie; con el .dmg basta, su ticket cubre el .app de dentro).
            { echo "NOTARY_KEY_ID=$ASC_KEY_ID"; echo "NOTARY_ISSUER=$ASC_ISSUER_ID"; echo "NOTARY_KEY_PATH=$KEY"; } >> "$GITHUB_ENV"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin ASC_KEY_ID/ASC_ISSUER_ID/ASC_PRIVATE_KEY: se firma pero no se notariza (Gatekeeper lo bloqueará)."
          fi
      - name: Paquetes
        shell: bash
        env:
          # Se exportan solo los que tienen valor: cargo-packager trata «vacío» como «presente».
          S_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          S_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          S_WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          S_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          for v in WINDOWS_CERTIFICATE_THUMBPRINT WINDOWS_TIMESTAMP_URL WINDOWS_SIGN_COMMAND \
                   AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            s="S_$v"
            if [ -n "${!s:-}" ]; then export "$v=${!s}"; fi
            unset "$s"
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cargo xtask package ${{ matrix.os }} --target ${{ matrix.target }} --tag "$GITHUB_REF_NAME"
          else
            cargo xtask package ${{ matrix.os }} --target ${{ matrix.target }}
          fi
      # El .msi de verdad: se instala en la máquina, se revisan los archivos, los accesos directos, el
      # protocolo, «Aplicaciones predeterminadas» y la clave de la suite; luego se desinstala y no debe
      # quedar nada.
      - name: Probar el instalador .msi
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*-windows-x64.msi | Select-Object -First 1
          if (-not $msi) { throw 'no hay .msi en dist' }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v instalar.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content instalar.log -Tail 100; throw "msiexec /i: $($p.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles 'IureDesk'
          foreach ($f in 'iuredesk.exe', 'iuredesk.ico', 'THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "falta $f" }
          }
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\IureDesk.lnk'
          if (-not (Test-Path $lnk)) { throw 'falta el acceso directo del menú Inicio' }
          $esc = Join-Path $env:PUBLIC 'Desktop\IureDesk.lnk'
          if (-not (Test-Path $esc)) { throw 'falta el acceso directo del escritorio' }
          $cmd = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\iuredesk\shell\open\command').'(default)'
          if ($cmd -notlike "*iuredesk.exe*%1*") { throw "protocolo iuredesk: mal registrado ($cmd)" }
          $reg = (Get-ItemProperty 'HKLM:\Software\RegisteredApplications').IureDesk
          if (-not $reg) { throw 'falta en «Aplicaciones predeterminadas»' }
          $suite = Get-ItemProperty 'HKLM:\Software\Iurefficient\IureDesk' -ErrorAction SilentlyContinue
          if (-not $suite.Version -or -not $suite.ProductCode -or -not $suite.InstallDir) { throw 'falta la clave de la suite (versión, carpeta y código)' }
          Write-Host "suite: $($suite.Version) en $($suite.InstallDir) ($($suite.ProductCode))"
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /l*v desinstalar.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content desinstalar.log -Tail 100; throw "msiexec /x: $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir 'iuredesk.exe')) { throw 'la desinstalación dejó el programa' }
          if ((Test-Path $lnk) -or (Test-Path $esc)) { throw 'la desinstalación dejó un acceso directo' }
          if (Test-Path 'Registry::HKEY_CLASSES_ROOT\iuredesk\shell\open\command') { throw 'la desinstalación dejó el protocolo' }
          if ((Get-ItemProperty 'HKLM:\Software\Iurefficient\IureDesk' -ErrorAction SilentlyContinue).Version) { throw 'la desinstalación dejó la clave de la suite' }
          Write-Host 'instalador .msi: instalar y desinstalar — ok'
      # Paquete para Microsoft Store (la Store lo firma), con lo mismo que instala el .exe/.msi
      # (iuredesk.exe, iuredesk.ico, LICENSE.md, NOTICE, README.txt, THIRD-PARTY-NOTICES.txt). La
      # identidad sale de Partner Center (Identidad del producto) y va en variables del repo; sin
      # ellas se usan valores de prueba. Además, una copia firmada con un certificado de prueba que
      # se instala, se prueba y se desinstala aquí mismo. Ninguno de los dos va a la release (el
      # job «Release» solo descarga los artefactos `iuredesk-*`). Ver «Microsoft Store (MSIX)» en
      # el README.
      - name: Paquete MSIX (Microsoft Store)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Output "::warning::Faltan las variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER o MSIX_PUBLISHER_DISPLAY_NAME: el .msix lleva una identidad de prueba y Partner Center lo rechazará."
          }
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'Iurefficient.IureDesk' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Iurefficient' }
          $display = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { 'Iurefficient' }
          $cargo = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'iuredesk' } | ForEach-Object { $_.version }
          # La Store no acepta un primer número 0 y exige el cuarto en 0; la preliminar va en el
          # tercero para que cada beta y la final crezcan: 0.1.0-beta.12 → 1.1.312.0, 0.1.0 → 1.1.999.0.
          $version = (cargo xtask msix-version).Trim()
          if ($version -notmatch '^[1-9]\d*\.\d+\.\d+\.0$') { throw "versión MSIX inválida: $version" }
          Write-Output "IureDesk $cargo → paquete $version"
          # Los valores van dentro de atributos XML.
          $identityXml = [System.Security.SecurityElement]::Escape($identity)
          $publisherXml = [System.Security.SecurityElement]::Escape($publisher)
          $displayXml = [System.Security.SecurityElement]::Escape($display)

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $tools = "$($sdk.FullName)\x64"
          Write-Output "Windows SDK: $tools"

          $root = 'msix\paquete'
          New-Item -ItemType Directory -Force $root, msix\store, msix\prueba | Out-Null
          Copy-Item -Recurse packaging\msix\Assets "$root\Assets"
          $stage = "target\packager\${{ matrix.target }}"
          Copy-Item "target\${{ matrix.target }}\dist\iuredesk.exe", assets\icons\iuredesk.ico $root
          foreach ($f in 'LICENSE.md', 'NOTICE', 'README.txt', 'THIRD-PARTY-NOTICES.txt') { Copy-Item "$stage\$f" $root }

          $manifest = Get-Content packaging\msix\AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $identityXml).Replace('@PUBLISHER@', $publisherXml)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $displayXml).Replace('@VERSION@', $version)
          if ($manifest -match '@[A-Z_]+@') { throw "quedó un marcador sin sustituir: $($Matches[0])" }
          # XML bien formado antes de empaquetar (p. ej. nada de «--» dentro de un comentario).
          try { $xml = [xml]$manifest } catch { throw "AppxManifest.xml no es XML válido: $_" }
          if ($xml.Package.Properties.DisplayName -ne 'IureDesk' -or $xml.Package.Applications.Application.VisualElements.DisplayName -ne 'IureDesk') {
            throw 'el DisplayName debe ser exactamente «IureDesk»'
          }
          Set-Content "$root\AppxManifest.xml" $manifest -Encoding utf8

          # resources.pri: idiomas e íconos sin fondo (altform-unplated) de la barra de tareas.
          & "$tools\makepri.exe" createconfig /cf msix\priconfig.xml /dq es-MX_en-US /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makepri.exe" new /pr $root /cf msix\priconfig.xml /mn "$root\AppxManifest.xml" /of "$root\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = "IureDesk_$cargo-windows-x64.msix"
          & "$tools\makeappx.exe" pack /d $root /p "msix\store\$msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copia de prueba: certificado autofirmado con el mismo Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'IureDesk (prueba)' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = ConvertTo-SecureString -String 'prueba' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix\prueba.pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath msix\prueba\IureDesk-prueba.cer | Out-Null
          $prueba = "msix\prueba\IureDesk_$cargo-windows-x64-prueba.msix"
          Copy-Item "msix\store\$msix" $prueba
          & "$tools\signtool.exe" sign /fd SHA256 /f msix\prueba.pfx /p prueba $prueba
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item msix\prueba.pfx

          # Prueba: instalar la copia firmada y, dentro del paquete (por el alias `iuredesk`): la
          # versión, el servidor MCP (initialize) y abrir la ventana; luego desinstalar.
          Import-Certificate -FilePath msix\prueba\IureDesk-prueba.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $prueba
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq $identity } | Select-Object -First 1
          if (-not $pkg) { throw 'el paquete no quedó instalado' }
          Write-Output "Instalado: $($pkg.PackageFullName) en $($pkg.InstallLocation)"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\iuredesk.exe"
          $fallas = @()
          if (-not (Test-Path $alias)) { $fallas += 'no apareció el alias de ejecución iuredesk.exe' }
          # iuredesk.exe es de subsistema «windows»: con la salida redirigida a archivos escribe ahí.
          $out = Join-Path $env:RUNNER_TEMP 'iuredesk-salida.txt'
          $err = Join-Path $env:RUNNER_TEMP 'iuredesk-error.txt'
          $p = Start-Process -FilePath $alias -ArgumentList '--version' -NoNewWindow -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(60000)) { $p.Kill(); $fallas += '--version no terminó en 60 s' }
          $texto = ("$(Get-Content $out -Raw)" + "$(Get-Content $err -Raw)").Trim()
          Write-Output "iuredesk --version → [$($p.ExitCode)] $texto"
          if ($texto -notmatch [regex]::Escape("iuredesk $cargo")) { $fallas += 'la versión no respondió dentro del paquete' }
          if ($texto -notmatch 'Microsoft Store \(MSIX\): s') { $fallas += 'la app no se detecta empaquetada (seguiría buscando actualizaciones)' }

          # Servidor MCP por stdio: `initialize` y debe contestar con serverInfo.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $alias
          $psi.Arguments = '--mcp'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $mcp = [System.Diagnostics.Process]::Start($psi)
          $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          $mcp.StandardInput.Flush()
          $linea = $mcp.StandardOutput.ReadLineAsync()
          if ($linea.Wait(60000)) { $resp = $linea.Result } else { $resp = '(sin respuesta en 60 s)' }
          $mcp.StandardInput.Close()
          if (-not $mcp.WaitForExit(30000)) { $mcp.Kill() }
          Write-Output "iuredesk --mcp initialize → $resp"
          if ("$resp" -notmatch '"serverInfo"') { $fallas += 'el servidor MCP no respondió a initialize dentro del paquete' }

          # La ventana: se abre como desde el menú Inicio y debe seguir viva a los 15 s.
          Start-Process explorer.exe "shell:AppsFolder\$($pkg.PackageFamilyName)!IureDesk"
          Start-Sleep -Seconds 15
          $vivo = Get-Process iuredesk -ErrorAction SilentlyContinue
          if ($vivo) {
            Write-Output "La ventana sigue abierta: $($vivo.Path)"
            $vivo | Stop-Process -Force
          } else {
            Write-Output "::warning::IureDesk no siguió abierto 15 s después de abrirlo desde el paquete (puede ser el runner sin GPU ni escritorio)"
          }
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage | Where-Object { $_.Name -eq $identity }) { $fallas += 'la desinstalación dejó el paquete' }
          if ($fallas) { $fallas | ForEach-Object { Write-Output "::error::MSIX: $_" }; exit 1 }
          Get-ChildItem msix\store, msix\prueba | ForEach-Object { Write-Output ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

      - name: Subir el MSIX para la Store
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          if-no-files-found: error
          path: msix/store/*

      - name: Subir el MSIX de prueba
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-prueba
          if-no-files-found: error
          path: msix/prueba/*
      # Una sola notarización, la del .dmg: el ticket cubre también el .app que lleva dentro, así que
      # se engrapa en los dos y se rehace el .app.tar.gz (lo que instala iureapps) con el .app ya
      # engrapado. Luego se comprueba todo como lo haría un Mac recién instalado. Va antes de
      # minisign porque engrapar cambia los archivos. Las primeras notarizaciones de una cuenta
      # nueva pueden tardar casi una hora.
      - name: Notarizar y comprobar Gatekeeper
        if: matrix.os == 'macos' && steps.apple.outputs.notarize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP=dist/IureDesk.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
          DMGS=(dist/*.dmg)
          [ "${#DMGS[@]}" -eq 1 ] || { echo "::error::esperaba un solo .dmg en dist"; exit 1; }
          DMG="${DMGS[0]}"
          NOTARY=(--key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          OUT="$(xcrun notarytool submit "$DMG" "${NOTARY[@]}" --wait --timeout 150m --output-format json || true)"
          echo "$OUT"
          field() { printf '%s' "$OUT" | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get(sys.argv[1], ""))
          except Exception: print("")' "$1"; }
          STATUS="$(field status)"; ID="$(field id)"
          if [ "$STATUS" != Accepted ]; then
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" "${NOTARY[@]}" || true; fi
            echo "::error::La notarización de $DMG no quedó aceptada (estado «${STATUS:-sin respuesta}», id ${ID:-ninguno})."
            exit 1
          fi
          xcrun stapler staple -v "$DMG"
          xcrun stapler staple -v "$APP"
          xcrun stapler validate "$DMG"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          TGZ=(dist/*.app.tar.gz)
          [ "${#TGZ[@]}" -eq 1 ] || { echo "::error::esperaba un solo .app.tar.gz en dist"; exit 1; }
          rm -f "${TGZ[0]}"
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "${TGZ[0]}" -C dist IureDesk.app
          # El .app del tar debe seguir firmado y engrapado.
          CHECK="$RUNNER_TEMP/tgz-check"; rm -rf "$CHECK"; mkdir -p "$CHECK"
          tar -xzf "${TGZ[0]}" -C "$CHECK"
          codesign --verify --deep --strict "$CHECK/IureDesk.app"
          xcrun stapler validate "$CHECK/IureDesk.app"
      - name: Firmas minisign (las verifica iureapps)
        shell: bash
        env:
          IUREDESK_MINISIGN_KEY: ${{ secrets.IUREDESK_MINISIGN_KEY }}
          IUREDESK_MINISIGN_PASSWORD: ${{ secrets.IUREDESK_MINISIGN_PASSWORD }}
        run: |
          if [ -z "$IUREDESK_MINISIGN_KEY" ]; then
            echo "::warning::Sin el secreto IUREDESK_MINISIGN_KEY: los paquetes salen sin .sig y iureapps los instalará sin verificar."
            exit 0
          fi
          shopt -s nullglob
          cargo xtask sign dist/*.tar.gz dist/*.deb dist/*.AppImage dist/*.exe dist/*.msi dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: iuredesk-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.sig

      - name: Borrar el keychain temporal y la clave de App Store Connect
        if: always() && matrix.os == 'macos'
        shell: bash
        run: |
          if [ -n "${{ steps.apple.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.apple.outputs.keychain }}" || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/devid.p12

  release:
    name: Release
    needs: package
    runs-on: ubuntu-22.04
    # Compila xtask para la página de descargas (R4.3).
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Solo los paquetes (`iuredesk-<triple>`): los MSIX (`msix-store`, `msix-prueba`) se suben a
      # mano a Partner Center y no van a la release.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: iuredesk-*
          merge-multiple: true
      - name: latest.json (alternativa de iureapps cuando la API de GitHub limita las consultas)
        if: github.ref_type == 'tag'
        working-directory: dist
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          entry() {
            f="IureDesk_${VER}-$2"
            [ -f "$f" ] || return 0
            sig=""
            if [ -f "$f.sig" ]; then sig="$(cat "$f.sig")"; fi
            jq -n --arg k "$1" --arg u "$BASE/$f" --arg s "$sig" '{($k): {url: $u, signature: $s}}'
          }
          {
            entry linux-x86_64 linux-x64.AppImage
            entry linux-x86_64-deb linux-x64.deb
            entry windows-x86_64 windows-x64.exe
            entry darwin-aarch64 macos-arm64.app.tar.gz
            entry darwin-x86_64 macos-x64.app.tar.gz
          } | jq -s --arg v "$VER" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "IureDesk $VER" \
                '{version: $v, notes: $n, pub_date: $d, platforms: (add // {})}' > latest.json
          cat latest.json
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # R4.3: página de descargas (estática, sin JavaScript). Se publica en GitHub Pages solo si
      # la variable del repositorio IUREDESK_PAGES vale "true" (Settings → Pages → GitHub Actions).
      - name: Página de descargas
        if: github.ref_type == 'tag'
        run: cargo run -q -p xtask -- site dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --out site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_type == 'tag' && vars.IUREDESK_PAGES == 'true'
        with:
          path: site
      - name: Release en este repositorio
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La fase sale de la etiqueta: v0.1.0-alpha.N → alfa, -beta.N → beta, -rc.N → candidata.
          case "$GITHUB_REF_NAME" in
            *-alpha*) FASE="alfa"; TITULO=" (alfa)" ;;
            *-beta*) FASE="beta"; TITULO=" (beta)" ;;
            *-rc*) FASE="candidata"; TITULO=" (candidata)" ;;
            *) FASE="estable"; TITULO="" ;;
          esac
          NOTES="docs/notas/$GITHUB_REF_NAME.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notas.md"
            printf 'IureDesk %s: versión %s para Linux, Windows y macOS.\n\nSe instala y actualiza desde iureapps (verifica las firmas minisign `.sig` con la clave de `docs/minisign.pub`). Verifica una descarga manual con `sha256sum -c SHA256SUMS`.\n' "${GITHUB_REF_NAME#v}" "$FASE" > "$NOTES"
          fi
          # Ni --draft ni --prerelease: /releases/latest (lo que consulta iureapps) los ignora.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "IureDesk ${GITHUB_REF_NAME#v}$TITULO" --notes-file "$NOTES"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: iuredesk-todos
          path: dist/

  pages:
    name: Página de descargas
    needs: release
    if: github.ref_type == 'tag' && vars.IUREDESK_PAGES == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
