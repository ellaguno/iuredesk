[package]
name = "iuredesk"
description = "IureDesk: correo, calendario, contactos y notas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

build = "build.rs"

[[bin]]
name = "iuredesk"
path = "src/main.rs"

[dependencies]
iuredesk-engine = { workspace = true }
iuredesk-store = { workspace = true }
iuredesk-accounts = { workspace = true }
iuredesk-ui = { workspace = true }
# `iuredesk --mcp` y el puente IPC con la ventana abierta (F4.2).
iuredesk-mcp = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "clipboard"] }
# Marco de ventana estilo Adwaita en GNOME/Wayland (sctk-adwaita, Rust puro) cuando se elige la
# barra de título del sistema; por omisión la barra es la integrada (UI-HEADER, sin decoraciones).
# Sin esto winit dibuja un marco genérico. En KDE y otros con xdg-decoration lo pone el sistema.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
dirs = { workspace = true }
# R1.2: notificaciones del sistema (D-Bus, WinRT, UserNotifications) e icono de la ventana.
iuredesk-desktop = { workspace = true }
# R1.4: Apple Events de abrir enlace/archivo en macOS (no-op en los demás sistemas).
iuredesk-macos-events = { workspace = true }
png = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Orden de los botones de la ventana (`button-layout`) por el portal de configuración XDG.
zbus = { workspace = true }

[lints]
workspace = true

# R1.2: icono y datos de versión en el .exe (solo al compilar para Windows; usa rc.exe o windres).
[build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
